name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest

  testnet-readonly:
    name: testnet read-only smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - name: Read Bittensor testnet head
        run: |
          python - <<'PY'
          import asyncio
          import bittensor as bt

          async def main():
              async with bt.Subtensor("test") as client:
                  block = await client.block()
                  print(f"Bittensor testnet block={block}")
                  if int(block) <= 0:
                      raise SystemExit("invalid testnet block height")

          asyncio.run(main())
          PY
