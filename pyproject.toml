[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consequent-subnet"
version = "0.1.0"
description = "Bittensor subnet for behaviorally useful execution memory"
requires-python = ">=3.10,<3.15"
dependencies = [
  "bittensor>=11.1,<12",
  # Bittensor 11.1.0's btcli currently depends on Typer internals. Pin the
  # exact CLI pair that produced Consequent's authoritative M0/M1 evidence so
  # evidence lanes cannot silently break when those transitive packages move.
  "typer==0.27.1",
  "click==8.4.2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["consequent", "miner", "validator"]
